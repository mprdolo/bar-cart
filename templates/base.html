<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bar Cart{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo">
                <span class="logo-icon"><svg viewBox="0 0 64 64" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="12" y="8" width="40" height="32" rx="3"/>
                    <line x1="12" y1="20" x2="52" y2="20"/>
                    <line x1="12" y1="28" x2="52" y2="28"/>
                    <rect x="16" y="12" width="6" height="6" rx="1"/>
                    <rect x="25" y="12" width="6" height="6" rx="1"/>
                    <rect x="34" y="12" width="6" height="6" rx="1"/>
                    <rect x="43" y="12" width="6" height="6" rx="1"/>
                    <line x1="18" y1="40" x2="18" y2="56"/>
                    <line x1="46" y1="40" x2="46" y2="56"/>
                    <circle cx="18" cy="56" r="3"/>
                    <circle cx="46" cy="56" r="3"/>
                </svg></span>
                <span class="logo-text">BAR CART</span>
            </a>
            <nav class="nav-links">
                <a href="/bar" class="nav-link{% if active_page == 'bar' %} active{% endif %}">My Bar</a>
                <a href="/results" class="nav-link{% if active_page == 'results' %} active{% endif %}">Cocktails</a>
            </nav>
        </div>
    </header>

    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <img src="{{ url_for('static', filename='img/Otter_stamp.png') }}" alt="" class="otter-stamp">
        <span>Bar Cart &mdash; Recipes from Kindred Cocktails</span>
    </footer>

    <div class="toast-container" id="toast-container"></div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
